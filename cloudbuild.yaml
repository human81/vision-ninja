# Cloud Build: build the studio image on amd64 (Cloud Run's arch) and push to Artifact Registry.
# Driven by scripts/deploy_cloudrun.sh, which sets the substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build",
           "--build-arg", "VARIANT=${_VARIANT}",
           "--build-arg", "LOCAL_MODELS=${_LOCAL_MODELS}",
           "-t", "${_IMAGE}", "."]
images: ["${_IMAGE}"]
substitutions:
  _VARIANT: cpu
  _LOCAL_MODELS: "off"
  _IMAGE: us-central1-docker.pkg.dev/${PROJECT_ID}/studio/vision-ninja:cpu
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
